<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d2b"><title>The Gentleman's Major</title><style>:root{--green:#173d2b;--cream:#f5efdf;--gold:#c9a65a;--red:#b52636;--red2:#7d1825;--blue:#25568f;--blue2:#17395f;--ink:#172019;--paper:#fffdf8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0d291c,#42664e);font-family:Georgia,serif;color:var(--ink)}.app{max-width:540px;margin:auto;min-height:100vh;background:var(--paper);box-shadow:0 0 35px #0006}header{padding:20px 18px 17px;text-align:center;color:#fff;background:linear-gradient(145deg,#0f2e20,#315d43);border-bottom:4px solid var(--gold)}.eyebrow{font:700 10px Arial;letter-spacing:3px}.logo{font-weight:900;font-size:28px;letter-spacing:1px}.script{color:#e6c66e;font-size:20px;font-style:italic;margin-top:2px}nav{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd}nav button{border:0;background:#fff;padding:11px 2px 9px;font:700 10px Arial;color:#667}nav button.active{color:var(--green);border-bottom:3px solid var(--gold)}main{padding:14px}.screen{display:none}.screen.active{display:block}h2{margin:3px 0 4px;color:var(--green);font-size:22px}.sub{margin:0 0 13px;font:12px Arial;color:#6d746f}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{color:#fff;border-radius:15px;padding:13px;text-align:center;box-shadow:0 4px 12px #0002}.red{background:linear-gradient(145deg,var(--red),var(--red2))}.blue{background:linear-gradient(145deg,var(--blue),var(--blue2))}.teamname{font:700 10px Arial;letter-spacing:1px}.score{font:900 40px Arial;margin:2px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:13px;margin:11px 0;box-shadow:0 3px 12px #0000000d}.goldbar{background:var(--cream);border-left:5px solid var(--gold);border-radius:8px;padding:9px;font:700 12px Arial}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.muted{font:11px Arial;function day1Diff(i){return holesFor(i).reduce((n,h)=>n+(h==='b'?1:h==='r'?-1:0),0)}function matchDone(i){let h=holesFor(i),d=Math.abs(day1Diff(i));return h.length===18||d>18-h.length}function matchText(i){let h=holesFor(i),d=day1Diff(i);if(!h.length)return 'All square — no holes recorded';if(matchDone(i)){if(!d)return 'Match halved';let side=d>0?'Bogeymen':'Pin Seekers';return h.length<18?side+' win '+Math.abs(d)+'&'+(18-h.length):side+' win '+Math.abs(d)+' UP'}return d?(d>0?'Bogeymen ':'Pin Seekers ')+Math.abs(d)+' UP after '+h.length:'All square after '+h.length}function updateDay1Points(){state.d1r=state.d1b=0;[1,2].forEach(i=>{if(!matchDone(i))return;let d=day1Diff(i);if(d>0)state.d1b+=3;else if(d<0)state.d1r+=3;else{state.d1r+=1.5;state.d1b+=1.5}})}function mcard(id,a,b){let h=holesFor(id),done=matchDone(id),next=h.length+1;let actions=done?'<p class="notice">Match complete.</p>':'<div class="grid3"><button class="btn blue" onclick="recordHole('+id+',\'b\')">Bogeymen won</button><button class="btn light" onclick="recordHole('+id+',\'d\')">Hole halved</button><button class="btn red" onclick="recordHole('+id+',\'r\')">Pin Seekers won</button></div><button class="btn light" style="width:100%;margin-top:8px" onclick="undoHole('+id+')">Undo last hole</button>';document.getElementById('match'+id).innerHTML='<h3>Match '+id+'</h3><p><span class="badge blue">BOGEYMEN</span> '+a+'</p><p><span class="badge red">PIN SEEKERS</span> '+b+'</p><div class="goldbar">'+(done?'Match complete':'Record hole '+next+' of 18')+'</div><p class="result">'+matchText(id)+'</p><p class="muted">'+h.length+' of 18 holes recorded.</p>'+actions}function recordHole(i,v){if(matchDone(i))return;let h=holesFor(i);h.push(v);state['m'+i]=h;updateDay1Points();render()}function undoHole(i){let h=holesFor(i);h.pop();state['m'+i]=h;updateDay1Points();render()}function shots(h,si){let base=Math.floor(h/18), rem=h%18;return base+(si<=rem?1:0)}function stb(gross,par,shot){let net=gross-shot;if(net<=par-2)return 4;if(net===par-1)return 3;if(net===par)return 2;if(net===par+1)return 1;return 0}function renderEntry(day){let hole=state[day===2?'h2':'h3'], pars=day===2?D2:D3, sis=day===2?SI2:SI3, arr=day===2?'d2':'d3';document.getElementById(arr+'entry').innerHTML=P.map((p,i)=>{let val=p[arr];let s=shots(p.h,sis[hole-1]);let pts=val?stb(+val,pars[hole-1],s):0;return `<div class="row"><div><b>${p.n}</b><div class="muted">H/cap ${p.h} • ${s} shot${s===1?'':'s'} • current ${pts} pts</div></div><input style="width:78px" type="number" min="1" max="12" placeholder="gross" value="${val||''}" onchange="setGross(${i},${day},this.value)"></div>`}).join('')}function setGross(i,day,v){P[i][day===2?'d2':'d3']=+v||0;render()}function prevHole(day){let k=day===2?'h2':'h3';state[k]=Math.max(1,state[k]-1);render()};function nextHole(day){let k=day===2?'h2':'h3';state[k]=Math.min(18,state[k]+1);render()}function total(p){return p.d2+p.d3}function render(){updateDay1Points();document.getElementById('d1r').textContent=state.d1r;document.getElementById('d1b').textContent=state.d1b;document.getElementById('homeRed').textContent=state.d1r;document.getElementById('homeBlue').textContent=state.d1b;document.getElementById('status').textContent='Day 1: '+matchText(1)+' • '+matchText(2)+';';let a=[...P].sort((x,y)=>total(y)-total(x));leaderboard.innerHTML=a.map((p,i)=>`<div class="row"><div><b>${i+1}. ${p.n}</b><div class="muted">${p.t==='red'?'Pin Seekers':'Bogeymen'} • H/cap ${p.h}</div></div><b>${total(p)}</b></div>`).join('');finalboard.innerHTML=leaderboard.innerHTML;mcard(1,'Rick Hamnett / Mark Hill','Paul Richardson / Steve Cornwell');mcard(2,'Chris Appleby / Mike Crabtree',"Mark Richardson / Frank O'Hara");let h2=state.h2,h3=state.h3;document.getElementById('h2num').textContent=h2;document.getElementById('h2par').textContent='Par '+D2[h2-1];document.getElementById('h2si').textContent='SI '+SI2[h2-1];document.getElementById('h3num').textContent=h3;document.getElementById('h3par').textContent='Par '+D3[h3-1];document.getElementById('h3si').textContent='SI '+SI3[h3-1];renderEntry(2);renderEntry(3)}window.GM={snapshot:()=>({state:{...state},players:P.map(p=>({d2:p.d2,d3:p.d3}))}),apply:data=>{Object.assign(state,data.state||{});state.m1=Array.isArray(state.m1)?state.m1:[];state.m2=Array.isArray(state.m2)?state.m2:[]
